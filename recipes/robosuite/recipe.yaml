# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: robosuite
  version: "1.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/robosuite-${{ version }}.tar.gz
  sha256: a8a6233d7458dbd91bf00a86cab15aa1c178bd9d1b28d515db2cf3d152cb48e6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.13.3
    - numba >=0.49.1
    - scipy >=1.2.3
    - mujoco-python >=2.3.0
    - pillow
    - py-opencv
    - termcolor

tests:
  - python:
      imports:
        - robosuite
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A Modular Simulation Framework and Benchmark for Robot Learning
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/ARISE-Initiative/robosuite
  repository: https://github.com/ARISE-Initiative/robosuite

extra:
  recipe-maintainers:
    - flferretti
