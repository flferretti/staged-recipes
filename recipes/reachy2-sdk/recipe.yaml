# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: reachy2-sdk
  version: "1.0.15"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/reachy2_sdk-${{ version }}.tar.gz
  sha256: 7b99853409008ba4885733af028d2594c0c461db8a8dcda592ae58c851d35ef5
  patches:
    - relax_upper_bounds.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - packaging
    - numpy >=1.24.0
    - protobuf >=4.25.0
    - grpcio >=1.59.0
    - pyquaternion ==0.9.9
    - py-opencv >=4.8.0
    - reachy2-sdk-api >=1.0.21,<1.1.0

tests:
  - python:
      imports:
        - reachy2_sdk
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Reachy 2 SDK
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/pollen-robotics/reachy2-sdk
  repository: https://github.com/pollen-robotics/reachy2-sdk

extra:
  recipe-maintainers:
    - flferretti
