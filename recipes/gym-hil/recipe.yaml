# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: gym-hil
  version: "0.1.14"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/gym_hil-${{ version }}.tar.gz
  sha256: aeee688dcb3ec72e7bcbe604df4a3f990cce49c8a2da469dd67c3a4eeb4c6bbb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}
    - mujoco-python >=2.3.7,<3.9.0
    - gymnasium >=0.29.1,<2.0.0
    - pygame >=2.5.1
    - pynput >=1.7.7
    - hidapi >=0.14.0
    - imageio >=2.34.0
    - imageio-ffmpeg
    - psutil
    - packaging

tests:
  - python:
      imports:
        - gym_hil
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A gymnasium environment for Human-in-the-Loop Reinforcement Learning
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/huggingface/gym-hil
  repository: https://github.com/huggingface/gym-hil

extra:
  recipe-maintainers:
    - traversaro
    - flferretti
